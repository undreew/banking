## basically .env equivalent
## just search the usage if needed to pull values from here into the code
server:
  port: ${PORT}

spring:
  application:
    name: banking
  profiles:
    active: dev

banking:
  auth:
    # NO DEFAULT. A missing BANKING_JWT_SECRET stops the boot
    # Generate with: openssl rand -base64 48
    secret: ${BANKING_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie: ${BANKING_REFRESH_COOKIE}
    
    access-cookie: ${BANKING_ACCESS_COOKIE} 
    previous-secret: ${BANKING_JWT_SECRET_PREVIOUS:}    
    refresh-token-absolute-ttl: 30d
    cookie-secure: false
    max-sessions: 0    
    lockout: 
      failures: 5
      window: 15m 
      duration: 15m
  security:
      allowed-origins: ${BANKING_ALLOWED_ORIGINS:http://localhost:8081}
    
  cors:
    allowed-origins: http://localhost:8081 # temp for FE endpoint