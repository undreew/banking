## for later -> .env.prod
banking:
  server:
    tomcat:
      remoteip:
        remote-ip-header: X-Forwarded-For
        protocol-header: X-Forwarded-Proto
  
  auth:
    # NO DEFAULT. A missing BANKING_JWT_SECRET stops the boot
    # Generate with: openssl rand -base64 48
    secret: ${BANKING_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: true
      
    previous-secret: ${BANKING_JWT_SECRET_PREVIOUS:}
    refresh-token-absolute-ttl: 30d
    access-cookie: ${BANKING_ACCESS_COOKIE:__Host-access_token}
    refresh-cookie: ${BANKING_REFRESH_COOKIE:__Host-access_token}
    max-sessions: ${BANKING_MAX_SESSIONS:0}
    lockout:
      failures: 5
      window: 15m
      duration: 15m
  security:
    allowed-origins: ${BANKING_ALLOWED_ORIGINS}